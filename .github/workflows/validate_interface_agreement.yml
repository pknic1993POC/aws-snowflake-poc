name: Validate Interface Agreement

on:

  pull_request:
    branches:
      - main
    paths:
      - "interface-agreements/source/**/*.xlsx"
      - "ia-converter/**"
      - "tests/**"

  push:
    branches:
      - main
    paths:
      - "interface-agreements/source/**/*.xlsx"
      - "ia-converter/**"
      - "tests/**"

permissions:
  contents: read
  id-token: write

jobs:
  validate:
    name: Validate Interface Agreements
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: ia-converter/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ia-converter/requirements.txt


      - name: Identify Interface Agreements to validate
        shell: bash
        run: |
          echo "Event: ${{ github.event_name }}"

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "PR to main detected. Validating only changed Interface Agreements."
          elif [ "${{ github.event_name }}" = "push" ]; then
            echo "Push to main detected. Validating Interface Agreements before generation/ingestion."
          else
            echo "Unsupported workflow event: ${{ github.event_name }}"
            exit 1
          fi

          find interface-agreements/source \
            -type f \
            -name "*.xlsx" \
            | sort \
            > changed-ias.txt

          echo ""
          echo "Interface Agreements to process:"
          cat changed-ias.txt

          if [ ! -s changed-ias.txt ]; then
            echo "No Interface Agreements found to process."
          fi

      - name: Validate Interface Agreements
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        shell: bash
        run: |
          mkdir -p build/reports
          mkdir -p build/generated

          while IFS= read -r ia_file; do
            [ -z "$ia_file" ] && continue

            echo "----------------------------------------"
            echo "Processing: $ia_file"
            echo "----------------------------------------"

            if [ "${{ github.event_name }}" = "pull_request" ]; then
              python ia-converter/convert.py \
                --input "$ia_file" \
                --output-dir build/generated \
                --report-dir build/reports \
                --validate-only
            else
              python ia-converter/convert.py \
                --input "$ia_file" \
                --output-dir build/generated \
                --report-dir build/reports
            fi
          done < changed-ias.txt

      - name: Call Snowflake stored procedure with generated JSON
        if: github.event_name == 'push'
        shell: bash
        env:
          SNOWFLAKE_PROCEDURE_NAME: "QA_INGESTION_CONFIG_DB_DEV.METADATA.SP_LOAD_CONFIG"
        run: |
          shopt -s nullglob
          json_files=(build/generated/*.json)

          if [ ${#json_files[@]} -eq 0 ]; then
            echo "No generated JSON files found in build/generated. Skipping Snowflake call."
            exit 0
          fi

          for json_file in "${json_files[@]}"; do
            echo "Calling ${SNOWFLAKE_PROCEDURE_NAME} with ${json_file}"
            payload=$(cat "$json_file")
            snow sql -q "CALL ${SNOWFLAKE_PROCEDURE_NAME}($$${payload}$$);"
          done

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ia-validation-results
          path: |
            build/generated/
            build/reports/
            changed-ias.txt
          if-no-files-found: warn
          retention-days: 14